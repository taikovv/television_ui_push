name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test launcher logic
        run: node --test tools/appearance.test.mjs tools/library.test.mjs
      - name: Validate and package unsigned app
        run: node tools/build.mjs
