<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>UTILITY — a tv should be a tool.</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="loading">
<div id="stage">
  <div id="boot" role="status" aria-live="polite" aria-label="Loading Utility">
    <div class="crt-content">
      <div class="crt-title" aria-hidden="true">loading<span class="crt-dot">.</span></div>
      <div class="crt-bar" aria-hidden="true"><div class="crt-signal"></div></div>
      <div class="crt-label" aria-hidden="true">utility</div>
    </div>
  </div>
  <div class="page" id="page">
    <h1>a quiet screen for watching, listening and casting.</h1>
    <div id="list"></div>
    <p class="project-note">utility. turn it on. choose something. music, films, whatever’s plugged in. a little sidequest in making a shared screen useful again.</p>
  </div>

  <div id="volume-osd" hidden role="status" aria-live="polite">
    <div class="volume-heading"><span id="volume-label">volume</span><span id="volume-value"></span></div>
    <div id="volume-meter" aria-hidden="true"></div>
  </div>

  <div class="stamp">
    <div class="footer-status">
      <span id="casting-status">airplay + screen mirroring: checking</span>
      <span id="said" role="status" aria-live="polite"></span>
    </div>
    <span id="key-hints">↑ ↓ choose &nbsp; ok open &nbsp; back top</span>
  </div>
</div>

<script src="catalog.js"></script>
<script src="device.js"></script>
<script src="library.js"></script>
<script src="appearance.js"></script>
<script src="volume.js"></script>
<script src="main.js"></script>
</body>
</html>
