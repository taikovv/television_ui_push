<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Home · Glass</title>
<style>
/* Option A: a tvOS-style home. Built for a 1920x1080 TV panel and an ES5-era
   Tizen web engine: no backdrop-filter, no inset, only opacity and transform
   animate. The stage scales down to fit when previewed in a desktop browser. */

:root {
  --ink: #fff;
  --dim: rgba(255, 255, 255, .64);
  --faint: rgba(255, 255, 255, .38);
  --edge: 100px;
  --tile-w: 312px;
  --tile-h: 188px;
  --gap: 40px;
  --row: 300px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

body {
  font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

#stage {
  position: absolute; left: 0; top: 0;
  width: 1920px; height: 1080px;
  overflow: hidden;
  transform-origin: 0 0;
  background: #05060a;
}

/* Ambient light: two layers, crossfaded on focus change. */

.amb { position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0; transition: opacity .8s var(--ease); }
.amb.on { opacity: 1; }

.shade {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background:
    linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.1) 40%, rgba(0,0,0,.72) 66%, rgba(0,0,0,.92) 100%),
    linear-gradient(90deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 60%);
  transition: opacity .5s var(--ease);
}
.deep .shade { opacity: 1; }
.deep .amb.on { opacity: .45; }

/* Status: AirPlay + clock, top right. */

.status {
  position: absolute; top: 56px; right: var(--edge);
  display: flex; align-items: center; gap: 36px;
  font-size: 28px; font-weight: 600;
  text-shadow: 0 2px 12px rgba(0,0,0,.35);
}
.status .air { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 24px; }
.status .air i { width: 10px; height: 10px; border-radius: 50%; background: #30d158; box-shadow: 0 0 12px #30d158; }
.status .clock { font-size: 36px; letter-spacing: -.01em; }

/* Top shelf: the focused app, large. */

.hero {
  position: absolute; left: var(--edge); top: 236px; width: 1200px;
  transition: opacity .45s var(--ease), transform .55s var(--ease);
}
.deep .hero { opacity: 0; transform: translateY(-80px); }
.hero .eyebrow { font-size: 24px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.hero .title { font-size: 120px; font-weight: 700; letter-spacing: -.035em; line-height: 1; margin-top: 20px; }
.hero .sub { font-size: 30px; font-weight: 500; color: var(--dim); margin-top: 26px; line-height: 1.4; max-width: 980px; }
.hero.swap { animation: swap .5s var(--ease); }
@keyframes swap { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* Grid of app tiles. */

.grid { position: absolute; left: 0; top: 628px; width: 100%; transition: transform .55s var(--ease); }
.rowname {
  position: absolute; left: var(--edge); margin-top: -58px;
  font-size: 24px; font-weight: 600; color: var(--faint);
  opacity: 0; transition: opacity .4s;
}
.deep .row.cur .rowname { opacity: 1; }
.row { position: relative; height: var(--row); padding-left: var(--edge); white-space: nowrap; perspective: 1400px; transition: opacity .4s var(--ease); }
.row.gone { opacity: 0; }

.tile {
  display: inline-block; position: relative; vertical-align: top;
  width: var(--tile-w); height: var(--tile-h); margin-right: var(--gap);
  border-radius: 24px;
  box-shadow: 0 12px 28px rgba(0,0,0,.4);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease), opacity .35s;
}
.row.dim .tile { opacity: .55; }
.tile .face {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 24px; overflow: hidden;
  display: flex; align-items: center; justify-content: center; gap: 18px;
}
.tile .sheen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(112deg, rgba(255,255,255,0) 32%, rgba(255,255,255,.26) 48%, rgba(255,255,255,0) 64%);
  transform: translateX(-130%);
}
.tile .label {
  position: absolute; top: 100%; left: -40px; right: -40px; margin-top: 26px;
  text-align: center; font-size: 24px; font-weight: 600; color: var(--ink);
  opacity: 0; transition: opacity .25s;
}
.tile.focus {
  transform: scale(1.14) translateY(-6px);
  box-shadow: 0 40px 72px rgba(0,0,0,.62);
  z-index: 2;
  animation: float 5s ease-in-out .4s infinite;
}
.tile.focus .sheen { animation: sheen 1.1s var(--ease) .12s 1 both; }
.tile.focus .label { opacity: 1; }
.tile.press { transform: scale(1.08) translateY(-2px); transition-duration: .12s; animation: none; }

@keyframes sheen { to { transform: translateX(130%); } }
@keyframes float {
  0%, 100% { transform: scale(1.14) translateY(-6px) rotateX(0) rotateY(0); }
  33% { transform: scale(1.14) translateY(-8px) rotateX(1.6deg) rotateY(-2.2deg); }
  66% { transform: scale(1.14) translateY(-5px) rotateX(-1.2deg) rotateY(1.8deg); }
}

/* Wordmarks are typeset stand-ins, not the real logos. On the TV the app
   icons come from the installed apps themselves. */

.w { font-weight: 700; letter-spacing: -.03em; color: #fff; }
.f-spotify { background: #121212; }
.f-spotify .w { font-size: 42px; }
.f-netflix { background: #000; }
.f-netflix .w { font-size: 54px; font-weight: 900; letter-spacing: .02em; color: #e50914; transform: scaleY(1.28); }
.f-paramount { background: linear-gradient(160deg, #0a6cff, #0031ad); }
.f-paramount .w { font-size: 40px; font-weight: 600; letter-spacing: -.01em; }
.f-hulu { background: #0b0c0f; }
.f-hulu .w { font-size: 70px; font-weight: 800; letter-spacing: -.05em; color: #1ce783; }
.f-youtube { background: #0f0f0f; }
.f-youtube .w { font-size: 42px; letter-spacing: -.05em; }
.f-appletv { background: linear-gradient(180deg, #2c2c2e, #000); }
.f-appletv .w { font-size: 46px; font-weight: 600; }
.f-prime { background: #0f171e; flex-direction: column; gap: 0; }
.f-prime .w { font-size: 42px; letter-spacing: -.02em; }
.f-max { background: linear-gradient(135deg, #002be7, #4a00c9); }
.f-max .w { font-size: 76px; font-weight: 800; letter-spacing: -.04em; }
.f-disney { background: radial-gradient(circle at 50% 120%, #2a62e8, #0a1647 70%); }
.f-disney .w { font-size: 50px; font-weight: 600; letter-spacing: -.01em; }
.f-airplay { background: linear-gradient(180deg, #434956, #1b1f27); }
.f-mirror { background: linear-gradient(180deg, #3b3170, #15122a); }
.f-hdmi { background: linear-gradient(180deg, #3a3a3c, #1c1c1e); }
.f-settings { background: linear-gradient(180deg, #6b6b70, #2c2c2e); }
.f-samsung { background: linear-gradient(180deg, #1f2a44, #0b1020); }
.f-sys .w { font-size: 34px; font-weight: 600; letter-spacing: -.01em; }
.f-sys svg { width: 52px; height: 52px; }

/* Toast for what OK would do. */

.toast {
  position: absolute; left: 50%; bottom: 64px;
  transform: translate(-50%, 24px);
  padding: 22px 34px; border-radius: 20px;
  background: rgba(40, 40, 46, .94);
  font-size: 26px; font-weight: 500; color: #fff; max-width: 1300px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  opacity: 0; transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast b { font-weight: 700; }
</style>
</head>
<body>
<div id="stage">
  <div class="amb" id="ambA"></div>
  <div class="amb" id="ambB"></div>
  <div class="shade"></div>

  <div class="status">
    <div class="air"><i></i>AirPlay ready</div>
    <div class="clock" id="clock">11:26</div>
  </div>

  <div class="hero" id="hero">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  'use strict';

  var ICON = {
    spotify: '<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#1db954"/><path d="M15 24c11-4 24-3 34 3M17 33c9-3 20-2 28 3M19 41c7-2 15-1 21 2" stroke="#121212" stroke-width="5" stroke-linecap="round" fill="none"/></svg>',
    youtube: '<svg width="62" height="44" viewBox="0 0 62 44"><rect width="62" height="44" rx="12" fill="#ff0000"/><path d="M25 13l15 9-15 9z" fill="#fff"/></svg>',
    prime: '<svg width="150" height="22" viewBox="0 0 150 22"><path d="M4 4c40 18 100 18 134 2" stroke="#1399ff" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M130 0l12 5-9 9" stroke="#1399ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>',
    airplay: '<svg viewBox="0 0 52 52" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"><path d="M14 37H8a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3h36a3 3 0 0 1 3 3v23a3 3 0 0 1-3 3h-6"/><path d="M26 31l11 14H15z" fill="#fff"/></svg>',
    mirror: '<svg viewBox="0 0 52 52" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"><rect x="4" y="9" width="32" height="22" rx="3"/><rect x="18" y="20" width="30" height="22" rx="3" fill="#2a2350"/><path d="M14 38h-4"/></svg>',
    hdmi: '<svg viewBox="0 0 52 52" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"><path d="M6 17h40v10l-6 8H12l-6-8z"/><path d="M16 24h20"/></svg>',
    settings: '<svg viewBox="0 0 52 52" fill="none" stroke="#fff" stroke-width="3.5"><circle cx="26" cy="26" r="7"/><path d="M26 4v7M26 41v7M4 26h7M41 26h7M10.4 10.4l5 5M36.6 36.6l5 5M10.4 41.6l5-5M36.6 15.4l5-5"/></svg>',
    samsung: '<svg viewBox="0 0 52 52" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"><path d="M8 24L26 9l18 15v19H8z"/><path d="M21 43V31h10v12"/></svg>'
  };

  // Brand light: [base, glow, second glow]
  var LIGHT = {
    spotify: ['#03100a', '#1db954', '#0b5a2a'],
    netflix: ['#0b0000', '#e50914', '#5c0006'],
    paramount: ['#000814', '#0a6cff', '#00268a'],
    hulu: ['#010d07', '#1ce783', '#085236'],
    youtube: ['#0b0b0b', '#ff1f1f', '#3d0000'],
    appletv: ['#060606', '#8e8e93', '#2c2c2e'],
    prime: ['#00060d', '#1399ff', '#00305c'],
    max: ['#00041a', '#002be7', '#6a00ff'],
    disney: ['#020818', '#1f56e0', '#00b7ff'],
    airplay: ['#05070b', '#8fa3c4', '#2c3a55'],
    mirror: ['#07050f', '#7b61ff', '#24165c'],
    hdmi: ['#0b0702', '#ff9f0a', '#4a2a00'],
    settings: ['#070707', '#8e8e93', '#3a3a3c'],
    samsung: ['#03060f', '#1f4fff', '#0a1a4a']
  };

  var ROWS = [
    { name: '', apps: [
      { id: 'spotify', name: 'Spotify', eyebrow: 'Music', sub: 'Your library, playlists and Spotify Connect. Picks up whatever your phone was playing.', face: ICON.spotify + '<span class="w">Spotify</span>' },
      { id: 'netflix', name: 'Netflix', eyebrow: 'Films & series', sub: 'Opens straight into your profile picker. No Samsung rows in between.', face: '<span class="w">NETFLIX</span>' },
      { id: 'paramount', name: 'Paramount+', eyebrow: 'Live sport & films', sub: 'CBS live, Champions League, Paramount originals.', face: '<span class="w">Paramount+</span>' },
      { id: 'hulu', name: 'Hulu', eyebrow: 'Series', sub: 'Next episode is one press away.', face: '<span class="w">hulu</span>' },
      { id: 'youtube', name: 'YouTube', eyebrow: 'Everything else', sub: 'Cast from your phone, or browse here.', face: ICON.youtube + '<span class="w">YouTube</span>' }
    ]},
    { name: 'More apps', apps: [
      { id: 'appletv', name: 'Apple TV', eyebrow: 'Apple originals', sub: 'Apple TV+ and your iTunes library.', face: '<span class="w">Apple TV</span>' },
      { id: 'prime', name: 'Prime Video', eyebrow: 'Films & series', sub: 'Amazon originals and rentals.', face: '<span class="w">prime video</span>' + ICON.prime },
      { id: 'max', name: 'Max', eyebrow: 'HBO & more', sub: 'HBO, Discovery and Warner films.', face: '<span class="w">max</span>' },
      { id: 'disney', name: 'Disney+', eyebrow: 'Films & series', sub: 'Disney, Pixar, Marvel, Star Wars.', face: '<span class="w">Disney+</span>' }
    ]},
    { name: 'Cast, inputs & system', apps: [
      { id: 'airplay', name: 'AirPlay', eyebrow: 'Always on', sub: 'Nothing to open. On your Mac or iPhone: Control Center → Screen Mirroring → this TV.', face: ICON.airplay + '<span class="w">AirPlay</span>', sys: true },
      { id: 'mirror', name: 'Screen Mirror', eyebrow: 'Smart View', sub: 'For Android phones and Windows laptops. Also always listening.', face: ICON.mirror + '<span class="w">Mirror</span>', sys: true },
      { id: 'hdmi', name: 'HDMI 1', eyebrow: 'Input', sub: 'Switch to whatever is plugged in.', face: ICON.hdmi + '<span class="w">HDMI 1</span>', sys: true },
      { id: 'settings', name: 'Settings', eyebrow: 'System', sub: 'Picture, sound, network. Samsung’s own panel.', face: ICON.settings + '<span class="w">Settings</span>', sys: true },
      { id: 'samsung', name: 'Samsung Home', eyebrow: 'Escape hatch', sub: 'The original Smart Hub, if you ever need it. Home brings you back here.', face: ICON.samsung + '<span class="w">Samsung</span>', sys: true }
    ]}
  ];

  var stage = document.getElementById('stage');
  var grid = document.getElementById('grid');
  var hero = document.getElementById('hero');
  var ambs = [document.getElementById('ambA'), document.getElementById('ambB')];
  var ambIdx = 0;
  var pos = { r: 0, c: 0 };
  var memory = [0, 0, 0];
  var tiles = [];

  function build() {
    var html = '';
    for (var r = 0; r < ROWS.length; r++) {
      html += '<div class="row" data-r="' + r + '">';
      if (ROWS[r].name) html += '<div class="rowname">' + ROWS[r].name + '</div>';
      for (var c = 0; c < ROWS[r].apps.length; c++) {
        var a = ROWS[r].apps[c];
        html += '<div class="tile" data-r="' + r + '" data-c="' + c + '"><div class="face f-' + a.id + (a.sys ? ' f-sys' : '') + '">' + a.face + '<div class="sheen"></div></div><div class="label">' + a.name + '</div></div>';
      }
      html += '</div>';
    }
    grid.innerHTML = html;
    var rows = grid.querySelectorAll('.row');
    for (r = 0; r < rows.length; r++) tiles.push(rows[r].querySelectorAll('.tile'));
  }

  function light(id) {
    var l = LIGHT[id];
    var next = ambs[1 - ambIdx];
    next.style.background =
      'radial-gradient(ellipse 60% 70% at 78% 18%, ' + l[1] + 'cc 0%, ' + l[1] + '00 60%),' +
      'radial-gradient(ellipse 55% 60% at 22% 68%, ' + l[2] + 'aa 0%, ' + l[2] + '00 65%),' + l[0];
    next.className = 'amb on';
    ambs[ambIdx].className = 'amb';
    ambIdx = 1 - ambIdx;
  }

  function render() {
    var a = ROWS[pos.r].apps[pos.c];
    for (var r = 0; r < tiles.length; r++) {
      for (var c = 0; c < tiles[r].length; c++) tiles[r][c].className = 'tile' + (r === pos.r && c === pos.c ? ' focus' : '');
      tiles[r][0].parentNode.className = 'row' + (r === pos.r ? ' cur' : r < pos.r - 1 ? ' gone' : pos.r > 0 ? ' dim' : '');
    }
    stage.className = pos.r > 0 ? 'deep' : '';
    // Deeper rows settle at y=640, with one row of context above them.
    grid.style.transform = pos.r > 0 ? 'translateY(' + -(300 * pos.r - 12) + 'px)' : 'none';
    document.getElementById('eyebrow').textContent = a.eyebrow;
    document.getElementById('title').textContent = a.name;
    document.getElementById('sub').textContent = a.sub;
    hero.className = 'hero';
    void hero.offsetWidth;
    hero.className = 'hero swap';
    light(a.id);
  }

  var toastTimer;
  function toast(html) {
    var t = document.getElementById('toast');
    t.innerHTML = html;
    t.className = 'toast on';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, 2600);
  }

  function open() {
    var a = ROWS[pos.r].apps[pos.c];
    var el = tiles[pos.r][pos.c];
    el.className = 'tile focus press';
    setTimeout(function () { el.className = 'tile focus'; }, 140);
    if (a.id === 'airplay') toast('<b>AirPlay is always on.</b> Pick this TV from Screen Mirroring on your Mac or iPhone.');
    else toast('Preview · on the TV this opens <b>' + a.name + '</b>');
  }

  function move(dr, dc) {
    var r = pos.r + dr;
    if (r < 0 || r >= ROWS.length) return;
    if (dr) {
      memory[pos.r] = pos.c;
      pos.r = r;
      pos.c = Math.min(memory[r], ROWS[r].apps.length - 1);
    } else {
      var c = pos.c + dc;
      if (c < 0 || c >= ROWS[r].apps.length) return;
      pos.c = c;
    }
    render();
  }

  // Arrow keys, Enter, and the Samsung remote's Return (10009).
  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    if (k === 37) move(0, -1);
    else if (k === 39) move(0, 1);
    else if (k === 38) move(-1, 0);
    else if (k === 40) move(1, 0);
    else if (k === 13) open();
    else if (k === 10009 || k === 27 || k === 8) { if (pos.r > 0) { pos.r = 0; pos.c = memory[0]; render(); } }
    else return;
    e.preventDefault();
  });

  grid.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== grid && !(t.className && String(t.className).indexOf('tile') === 0)) t = t.parentNode;
    if (!t || t === grid) return;
    var r = +t.getAttribute('data-r'), c = +t.getAttribute('data-c');
    if (r === pos.r && c === pos.c) open(); else { pos.r = r; pos.c = c; render(); }
  });

  function tick() {
    var d = new Date(), h = d.getHours() % 12 || 12, m = d.getMinutes();
    document.getElementById('clock').textContent = h + ':' + (m < 10 ? '0' : '') + m;
  }

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    var x = (window.innerWidth - 1920 * s) / 2, y = (window.innerHeight - 1080 * s) / 2;
    stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  }

  build();
  render();
  tick();
  setInterval(tick, 10000);
  fit();
  window.addEventListener('resize', fit);
}());
</script>
</body>
</html>
